name: Veil
options:
  bundleIdPrefix: com.veil
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    INFOPLIST_FILE: Info.plist
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 11.0.0

targets:
  Veil:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - ".git"
          - ".github"
          - "generate_icon.py"
          - "project.yml"
          - "README.md"
          - "*.yml"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.veil.store
        INFOPLIST_FILE: Info.plist
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFirestoreSwift
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseAuthCombine-Community   # not strictly needed but safe

name: Build & Quick OTA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Pillow
        run: pip3 install --break-system-packages Pillow

      - name: Install cloudflared
        run: brew install cloudflared

      - name: Generate app icon
        run: python3 generate_icon.py

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build IPA
        run: |
          xcodebuild archive \
            -project Veil.xcodeproj \
            -scheme Veil \
            -archivePath build/Veil.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          cd build/Veil.xcarchive/Products/Applications/
          mkdir Payload
          cp -R Veil.app Payload/
          zip -r Veil.ipa Payload
          cp Veil.ipa ../../../../

      - name: Serve OTA
        run: |
          # Create serve directory
          mkdir -p serve
          cp Veil.ipa serve/

          # Create manifest
          cat > serve/manifest.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>items</key>
              <array>
                  <dict>
                      <key>assets</key>
                      <array>
                          <dict>
                              <key>kind</key>
                              <string>software-package</string>
                              <key>url</key>
                              <string>TUNNEL_URL/Veil.ipa</string>
                          </dict>
                      </array>
                      <key>metadata</key>
                      <dict>
                          <key>bundle-identifier</key>
                          <string>com.veil.store</string>
                          <key>bundle-version</key>
                          <string>1.0</string>
                          <key>kind</key>
                          <string>software</string>
                          <key>title</key>
                          <string>Veil</string>
                      </dict>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF

          # Start tunnel in background
          cloudflared tunnel --url http://localhost:8080 &
          sleep 5

          # Get tunnel URL
          TUNNEL_URL=$(curl -s http://localhost:4040/api/tunnels | grep -o '"https://[^"]*trycloudflare.com"')
          echo "Tunnel URL: $TUNNEL_URL"

          # Update manifest with actual URL
          sed -i "" "s|TUNNEL_URL|$TUNNEL_URL|g" serve/manifest.plist

          # Start simple HTTP server
          cd serve && python3 -m http.server 8080 &
          sleep 2

          # Print OTA link
          echo ""
          echo "==================================="
          echo "  OTA INSTALL LINK (6hr window):"
          echo "  itms-services://?action=download-manifest&url=${TUNNEL_URL}/manifest.plist"
          echo "==================================="
          echo ""

          # Keep alive for 1 hour to allow download
          sleep 3600
        timeout-minutes: 70

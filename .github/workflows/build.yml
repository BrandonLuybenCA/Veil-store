name: Build Veil IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install xcodegen
          pip3 install Pillow

      - name: Generate app icon
        run: python3 generate_icon.py

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build IPA
        run: |
          xcodebuild archive \
            -project Veil.xcodeproj \
            -scheme Veil \
            -archivePath build/Veil.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          cp -R build/Veil.xcarchive/Products/Applications/Veil.app Payload/
          zip -r Veil.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Veil.ipa
          path: Veil.ipa

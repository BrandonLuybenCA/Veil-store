name: Build Veil IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Pillow
        run: pip3 install --break-system-packages Pillow

      - name: Generate app icon
        run: python3 generate_icon.py

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build IPA
        run: |
          xcodebuild archive \
            -project Veil.xcodeproj \
            -scheme Veil \
            -archivePath build/Veil.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # Create the IPA manually with proper structure
          cd build/Veil.xcarchive/Products/Applications/
          mkdir Payload
          cp -R Veil.app Payload/
          zip -r ../../../../Veil.ipa Payload
          cd ../../../../

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Veil Build ${{ github.run_number }}
          files: Veil.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Veil IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Pillow
        run: pip3 install --break-system-packages Pillow

      - name: Generate app icon
        run: python3 generate_icon.py

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build Simulator IPA
        run: |
          xcodebuild build \
            -project Veil.xcodeproj \
            -scheme Veil \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=build/Simulator

          # Create IPA from simulator build
          cd build/Simulator
          mkdir Payload
          cp -R Veil.app Payload/
          zip -r ../../Veil_Simulator.zip Payload
          cd ../..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Veil Simulator Build ${{ github.run_number }}
          files: Veil_Simulator.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

workflows:
  build-sign-ota:
    name: Build, Sign & OTA
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    environment:
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - ~/Library/Caches/CocoaPods
        - ~/.cocoapods
        - Pods
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      
      - name: Install Pillow
        script: pip3 install Pillow
      
      - name: Install cloudflared
        script: brew install cloudflared
      
      - name: Generate app icon
        script: python3 generate_icon.py
      
      - name: Generate Xcode project
        script: xcodegen generate --spec project.yml
      
      - name: Create Export Options Plist
        script: |
          cat > exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>AUTO</string>
          </dict>
          </plist>
          EOF
      
      - name: Build, Sign, and Archive
        script: |
          xcodebuild archive \
            -project Veil.xcodeproj \
            -scheme Veil \
            -destination 'generic/platform=iOS' \
            -archivePath build/Veil.xcarchive \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            DEVELOPMENT_TEAM=AUTO \
            CODE_SIGN_STYLE=Automatic \
            APPLE_ID="brandonluyben@icloud.com" \
            APPLE_APP_SPECIFIC_PASSWORD="@HOME47WILLAMa"
      
      - name: Export Signed IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/Veil.xcarchive \
            -exportPath build/ \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration
      
      - name: Setup OTA serve directory
        script: |
          mkdir -p serve
          cp build/Veil.ipa serve/
          
          cat > serve/manifest.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key>
                    <string>software-package</string>
                    <key>url</key>
                    <string>TUNNEL_URL/Veil.ipa</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key>
                  <string>com.veil.store</string>
                  <key>bundle-version</key>
                  <string>1.0</string>
                  <key>kind</key>
                  <string>software</string>
                  <key>title</key>
                  <string>Veil</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          EOF
      
      - name: Start HTTP server and Cloudflare tunnel
        script: |
          cd serve
          python3 -m http.server 8080 &
          SERVER_PID=$!
          cd ..
          
          sleep 2
          
          cloudflared tunnel --url http://localhost:8080 > tunnel.log 2>&1 &
          TUNNEL_PID=$!
          
          TUNNEL_URL=""
          for i in {1..30}; do
            TUNNEL_URL=$(grep -o 'https://[a-z0-9.-]*\.trycloudflare\.com' tunnel.log 2>/dev/null | head -1)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
            sleep 2
          done
          
          if [ -z "$TUNNEL_URL" ]; then
            echo "FAILED TO GET TUNNEL URL"
            cat tunnel.log
            exit 1
          fi
          
          sed -i '' "s|TUNNEL_URL|$TUNNEL_URL|g" serve/manifest.plist
          
          echo ""
          echo "========================================="
          echo "  INSTALL ON YOUR IPHONE:"
          echo ""
          echo "  itms-services://?action=download-manifest&url=${TUNNEL_URL}/manifest.plist"
          echo ""
          echo "  ⚠️  Tunnel alive for 60 minutes"
          echo "========================================="
          echo ""
          
          sleep 3600
    artifacts:
      - build/Veil.ipa
      - serve/manifest.plist
    publishing:
      email:
        recipients:
          - luybenbrandon35@gmail.com
        notify:
          success: true
          failure: true
